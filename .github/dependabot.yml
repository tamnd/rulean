version: 2

updates:
  # Workflows pin each action to a commit SHA, with the tag in a comment. Dependabot changes the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "area/ci"
      - "type/chore"
    groups:
      actions:
        patterns:
          - "*"

  # The verified crates have no dependencies. This entry covers the tools, the CLI and the tests.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "area/ci"
      - "type/chore"
    groups:
      cargo:
        patterns:
          - "*"
