name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# No job in this workflow writes to the repository. A job that needs more access must ask for it by name.
permissions:
  contents: read

# A new push cancels the older run on the same branch. On main, each commit gets its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p rulean-ffi --all-targets --locked --features export -- -D warnings
      - run: cargo clippy -p rulean-ffi --all-targets --locked --features dual -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      # The release profile has its own settings (fat LTO, abort on panic, overflow checks). Build it on each platform so that a fault in it shows before a release.
      - run: cargo build --workspace --locked --release

  # The build with 64-bit expression handles (spec 04.2.1). It is a separate type, so clippy and the tests run on it too.
  wide:
    name: wide
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked --features rulean-store/wide -- -D warnings
      - run: cargo test --workspace --locked --features rulean-store/wide

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --locked

  # The commands that exist must work. The commands that are not written yet must exit with code 2 (decline) and never with 0.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo build --locked --bin rulean --bin rulean-bench
      # The bench harness runs `true` and `false` as the checker on one good test and one bad test. GitHub-hosted runners have no hardware counters, so the counter is none.
      - name: bench harness
        run: |
          mkdir -p _tmp/bench/good _tmp/bench/bad
          touch _tmp/bench/good/a.ndjson _tmp/bench/bad/b.ndjson
          target/debug/rulean-bench run --counter none --out _tmp/bench/true.json _tmp/bench -- true {}
          target/debug/rulean-bench run --counter none --out _tmp/bench/false.json _tmp/bench -- false {}
          jq -e '[.results[].correctness] == ["correct", "incorrect"]' _tmp/bench/true.json
          jq -e '[.results[].correctness] == ["incorrect", "correct"]' _tmp/bench/false.json
          jq -e '.results[0].max_rss > 0' _tmp/bench/true.json
      - name: help and version
        run: |
          target/debug/rulean help
          # The line sha256 shows if the runner has the SHA instructions, so the log shows which code the tests of rulean-io ran.
          target/debug/rulean version
          target/debug/rulean version | grep -E '^rulean [0-9]+\.[0-9]+\.[0-9]+'
          target/debug/rulean version | grep -E '^sha256: '
      - name: an unknown command exits with code 64
        run: |
          code=0
          target/debug/rulean frobnicate || code=$?
          test "$code" = 64
      - name: check accepts and rejects
        run: |
          mkdir -p _tmp
          target/debug/rulean check --report _tmp/accept.json crates/rulean-cli/tests/data/axiom.ndjson
          jq -e '.verdict == "accept" and .summary.accepted == 1 and .input.profile == "v4.35"' _tmp/accept.json
          code=0
          target/debug/rulean check --format json - < crates/rulean-cli/tests/data/loose-bvar.ndjson > _tmp/reject.json || code=$?
          test "$code" = 1
          jq -e '.verdict == "reject" and .failed_decl == "B"' _tmp/reject.json
          code=0
          target/debug/rulean check --threads 2 --format json crates/rulean-cli/tests/data/loose-bvar.ndjson > _tmp/reject2.json || code=$?
          test "$code" = 1
          jq -e '.verdict == "reject" and .failed_decl == "B"' _tmp/reject2.json

  # Every test of the Lean Kernel Arena must parse (milestone M1) and give the expected verdict (milestone M2). The job downloads the Arena, so it depends on arena.lean-lang.org and is not a required check.
  arena:
    name: arena
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo build --locked --release --bin rulean
      - run: scripts/arena-fetch.sh _tmp/arena
      - run: scripts/arena-parse.sh _tmp/arena/tests
      - name: the parser tests on the Arena
        run: RULEAN_ARENA="$PWD/_tmp/arena/tests" cargo test --locked --release -p rulean-format --test arena
      - name: the Init prelude on engine R
        run: cargo test --locked --release -p rulean-core --test arena
      # The reference digests of primitive pinning (spec 05.8) and the digests of the axiom form must be the digests of the Lean v4.36.0 exports of the Arena.
      - name: the pinning digests
        run: |
          a=_tmp/arena/tests/good
          python3 scripts/pin-digests.py "$a/init-prelude.ndjson" "$a/perf/gf3-matrix-product.ndjson" "$a/perf/short-circuit-and.ndjson" "$a/perf/grind-ring-5.ndjson" | diff - crates/rulean-core/src/pin_ref_v4_35.in
          python3 scripts/pin-digests.py --axiom "$a/init-prelude.ndjson" "$a/perf/gf3-matrix-product.ndjson" "$a/perf/short-circuit-and.ndjson" "$a/perf/grind-ring-5.ndjson" | diff - crates/rulean-core/src/pin_axiom_v4_35.in
      - name: the verdicts of the Arena entry
        run: scripts/arena-check.sh _tmp/arena/tests
      - name: engine F and engine R on the Arena
        run: scripts/arena-confirm.sh _tmp/arena/tests
      - name: the scheduler on the Arena
        run: scripts/arena-threads.sh _tmp/arena/tests 4

  # The Arena tarball does not have the 30 tests with the outcome either, so the job builds them from the Arena sources at the commit of results.json with the Lean v4.36.0 release. The verdicts must be the verdicts of the official kernel in docs/arena/either-v4.35.tsv. Then the job runs `leanchecker` of v4.37.0-rc1 on the same exports, and the verdicts of that official kernel and of rulean with the profile v4.37 must be the verdicts in docs/arena/either-v4.37.tsv. The job depends on arena.lean-lang.org and on the Lean release, so it is not a required check.
  arena-either:
    name: arena either
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_ASSET: lean-4.36.0-linux.tar.zst
      LEAN_SHA256: 2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb
      LEAN37_ASSET: lean-4.37.0-rc1-linux.tar.zst
      LEAN37_SHA256: 2e1bbb832870bb81b7131cb70b13aec2cc7ed9f22e2bdbb236b86076ae20382d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo build --locked --release --bin rulean
      - run: scripts/arena-fetch.sh _tmp/arena
      - name: the Lean v4.36.0 release
        run: |
          mkdir -p _tmp/lean
          curl -sSfL --retry 3 -o "_tmp/lean/$LEAN_ASSET" "https://github.com/leanprover/lean4/releases/download/v4.36.0/$LEAN_ASSET"
          echo "$LEAN_SHA256  _tmp/lean/$LEAN_ASSET" | sha256sum -c -
          tar --zstd -xf "_tmp/lean/$LEAN_ASSET" -C _tmp/lean
          echo "$PWD/_tmp/lean/lean-4.36.0-linux/bin" >> "$GITHUB_PATH"
      - name: the Arena sources at the commit of the results
        run: |
          rev="$(jq -r .meta.git_revision _tmp/arena/results.json)"
          git init -q _tmp/src/arena
          git -C _tmp/src/arena fetch -q --depth 1 https://github.com/leanprover/lean-kernel-arena "$rev"
          git -C _tmp/src/arena checkout -q FETCH_HEAD
      - name: the exports of the either tests
        run: |
          lean --version
          scripts/arena-build.py _tmp/src/arena _tmp/arena/results.json _tmp/arena-extra
      - name: the verdicts of the either tests
        run: scripts/arena-check.sh _tmp/arena-extra
      - name: engine F and engine R on the either tests
        run: scripts/arena-confirm.sh _tmp/arena-extra
      - name: the Lean v4.37.0-rc1 release, not on PATH
        run: |
          mkdir -p _tmp/lean37
          curl -sSfL --retry 3 -o "_tmp/lean37/$LEAN37_ASSET" "https://github.com/leanprover/lean4/releases/download/v4.37.0-rc1/$LEAN37_ASSET"
          echo "$LEAN37_SHA256  _tmp/lean37/$LEAN37_ASSET" | sha256sum -c -
          tar --zstd -xf "_tmp/lean37/$LEAN37_ASSET" -C _tmp/lean37
      - name: the official kernel of v4.37.0-rc1 on the either tests
        env:
          ARENA_TIMEOUT: 120
        run: scripts/arena-official.sh _tmp/arena-extra docs/arena/either-v4.37.tsv "$PWD/_tmp/lean37/lean-4.37.0-rc1-linux/bin/leanchecker"
      - name: the verdicts of the either tests with the profile v4.37
        env:
          ARENA_PROFILE: v4.37
        run: scripts/arena-check.sh _tmp/arena-extra
      - name: engine F and engine R on the either tests with the profile v4.37
        env:
          ARENA_PROFILE: v4.37
        run: scripts/arena-confirm.sh _tmp/arena-extra

  # rulean as an external kernel of lake comparator, with the bwrap sandbox of lake (spec 09.5), and the work gate of the quick suite on Init and Std (spec 08.7.4). Ubuntu 24.04 blocks the user namespaces that bwrap needs, so the job allows them first. The job depends on the Lean release, so it is not a required check.
  lake:
    name: lake comparator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LEAN_ASSET: lean-4.36.0-linux.tar.zst
      LEAN_SHA256: 2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo build --locked --release --bin rulean --bin rulean-bench
      - name: bwrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: the Lean v4.36.0 release
        run: |
          mkdir -p _tmp/lean
          curl -sSfL --retry 3 -o "_tmp/lean/$LEAN_ASSET" "https://github.com/leanprover/lean4/releases/download/v4.36.0/$LEAN_ASSET"
          echo "$LEAN_SHA256  _tmp/lean/$LEAN_ASSET" | sha256sum -c -
          tar --zstd -xf "_tmp/lean/$LEAN_ASSET" -C _tmp/lean
          echo "$PWD/_tmp/lean/lean-4.36.0-linux/bin" >> "$GITHUB_PATH"
      - name: rulean in lake comparator
        run: scripts/lake-comparator.sh
      - name: the work gate on Init and Std of the release
        run: scripts/work-gate.sh docs/bench/work.json

  # The Lean objects of rulean-ffi with the runtime of the Lean v4.36.0 release (spec 09.6.3). The test loads libleanshared with dlopen, makes terms with the constructors of Lean, and gives them to functions of Lean. RULEAN_LEAN_LIB is set, so a library that does not load is a failure. The job depends on the Lean release, so it is not a required check.
  ffi-runtime:
    name: ffi runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_ASSET: lean-4.36.0-linux.tar.zst
      LEAN_SHA256: 2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: the Lean v4.36.0 release
        run: |
          mkdir -p _tmp/lean
          curl -sSfL --retry 3 -o "_tmp/lean/$LEAN_ASSET" "https://github.com/leanprover/lean4/releases/download/v4.36.0/$LEAN_ASSET"
          echo "$LEAN_SHA256  _tmp/lean/$LEAN_ASSET" | sha256sum -c -
          tar --zstd -xf "_tmp/lean/$LEAN_ASSET" -C _tmp/lean
      - name: the runtime test of rulean-ffi
        run: RULEAN_LEAN_LIB="$PWD/_tmp/lean/lean-4.36.0-linux/lib/lean/libleanshared.so" cargo test --locked -p rulean-ffi --features export --test runtime --test dual -- --nocapture
      - name: the static library of rulean-ffi exports the kernel symbols
        run: |
          cargo rustc --locked -p rulean-ffi --features export --crate-type staticlib
          nm -g --defined-only target/debug/librulean_ffi.a > _tmp/symbols.txt
          grep -w 'T lean_add_decl' _tmp/symbols.txt
          grep -w 'T lean_add_decl_without_checking' _tmp/symbols.txt
          grep -w 'T lean_elab_add_decl' _tmp/symbols.txt
          grep -w 'T lean_elab_add_decl_without_checking' _tmp/symbols.txt
          grep -w 'T lean_kernel_is_def_eq' _tmp/symbols.txt
          grep -w 'T lean_kernel_whnf' _tmp/symbols.txt
          grep -w 'T lean_kernel_check' _tmp/symbols.txt

  # The lean binary of Lean v4.36.0 with rulean as its kernel (spec 09.6.2), on macOS and on Linux. scripts/lean-build.sh links the static libraries of the release with the static library of rulean-ffi. The job runs tests/lean-build/smoke.lean with the lean of the release, with the new lean and with the dual-kernel build of scripts/lean-build.sh --dual, and the outputs must be the same. The job depends on the Lean release, so it is not a required check.
  lean-build:
    name: lean build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            lean: lean-4.36.0-darwin_aarch64
            sha256: 49acada8749ad1343eff1224a3d2510ac61ed53363d37b5e738e8c587e7deabd
          - os: ubuntu-24.04
            lean: lean-4.36.0-linux
            sha256: 2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb
    env:
      LEAN_DIR: ${{ matrix.lean }}
      LEAN_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      # llvm-objcopy and llvm-nm with the LLVM of rustc, which can read the bitcode objects of the Rust library.
      - run: rustup component add llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      # The release of Lean uses libc++, and on Linux it has no headers of libc++.
      - name: the headers of libc++
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libc++-dev libc++abi-dev
      - name: the Lean v4.36.0 release
        run: |
          mkdir -p _tmp/lean
          curl -sSfL --retry 3 -o "_tmp/lean/$LEAN_DIR.tar.zst" "https://github.com/leanprover/lean4/releases/download/v4.36.0/$LEAN_DIR.tar.zst"
          echo "$LEAN_SHA256  _tmp/lean/$LEAN_DIR.tar.zst" | shasum -a 256 -c -
          zstd -dc "_tmp/lean/$LEAN_DIR.tar.zst" | tar -xf - -C _tmp/lean
          rm "_tmp/lean/$LEAN_DIR.tar.zst"
      - name: lean with rulean as its kernel
        run: scripts/lean-build.sh _tmp/lean-rulean "$PWD/_tmp/lean/$LEAN_DIR"
      - name: the same output as the lean of the release
        run: |
          status=0
          "_tmp/lean/$LEAN_DIR/bin/lean" tests/lean-build/smoke.lean > _tmp/smoke-cpp.txt 2>&1 || status=$?
          echo "exit $status" >> _tmp/smoke-cpp.txt
          status=0
          _tmp/lean-rulean/bin/lean tests/lean-build/smoke.lean > _tmp/smoke-rulean.txt 2>&1 || status=$?
          echo "exit $status" >> _tmp/smoke-rulean.txt
          cat _tmp/smoke-rulean.txt
          diff _tmp/smoke-cpp.txt _tmp/smoke-rulean.txt
      # The dual-kernel build of spec 11.3.1 calls the C++ kernel and rulean on each declaration and term, and it stops if the results differ.
      - name: the dual-kernel build
        run: scripts/lean-build.sh --dual _tmp/lean-dual "$PWD/_tmp/lean/$LEAN_DIR"
      - name: the same output with the dual-kernel build
        run: |
          status=0
          _tmp/lean-dual/bin/lean tests/lean-build/smoke.lean > _tmp/smoke-dual.txt 2>&1 || status=$?
          echo "exit $status" >> _tmp/smoke-dual.txt
          diff _tmp/smoke-cpp.txt _tmp/smoke-dual.txt
      # If a step fails, the log shows the libraries of the release.
      - name: the libraries of the release
        if: failure()
        run: |
          find "_tmp/lean/$LEAN_DIR/lib" -maxdepth 2 \( -name '*.a' -o -name '*.so*' \) -exec ls -l {} +
          "_tmp/lean/$LEAN_DIR/bin/leanc" --print-ldflags || true

  # The cross-validation of the `.olean` reader with lean4export on Init and Std (spec 07.3.6), for each Lean release of a profile (spec 05.2). v4.35.0 and v4.36.0 have the profile v4.35 and write oleans of version 2. v4.37.0-rc1 has the profile v4.37 and writes oleans of version 4. For a future release that has no profile yet, set NO_PROFILE=1 for the script (`scripts/olean-xval.sh`), so rulean must decline the export and the oleans give only a parse. The job depends on the Lean releases, so it is not a required check.
  olean-xval:
    name: olean cross-validation (v${{ matrix.lean }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - lean: 4.35.0
            sha256: 7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
          - lean: 4.36.0
            sha256: 2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb
          - lean: 4.37.0-rc1
            sha256: 2e1bbb832870bb81b7131cb70b13aec2cc7ed9f22e2bdbb236b86076ae20382d
    env:
      LEAN: ${{ matrix.lean }}
      LEAN_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo build --locked --release --bin rulean
      - run: cargo build --locked --release -p rulean-olean --example olean_compare
      - name: the Lean release
        run: |
          mkdir -p _tmp/lean
          curl -sSfL --retry 3 -o "_tmp/lean/lean.tar.zst" "https://github.com/leanprover/lean4/releases/download/v$LEAN/lean-$LEAN-linux.tar.zst"
          echo "$LEAN_SHA256  _tmp/lean/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "_tmp/lean/lean.tar.zst" -C _tmp/lean
          echo "$PWD/_tmp/lean/lean-$LEAN-linux/bin" >> "$GITHUB_PATH"
      - name: the .olean reader and lean4export on Init and Std
        run: scripts/olean-xval.sh "_tmp/lean/lean-$LEAN-linux/lib/lean"

  # The repository rules of the spec: the dependency rule (03.3), the no-C policy (13.3) and the Aeneas subset (10.6). `cargo xtask all` also scans the vendored source of each dependency.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask all
      # fuzz/ is a separate workspace with its own lock file. A version bump must also update it, or the weekly fuzz run fails.
      - name: the lock file of fuzz/ is up to date
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 >/dev/null

  # Charon and Aeneas translate the verified core to Lean (spec 10.3). The tools come from flake.nix. hacl.cachix.org is the binary cache of Aeneas, but it does not have all of the paths of our Aeneas commit. So the job also keeps the full Nix store in one Actions cache entry, keyed by flake.lock. Only runs on main save the entry, and other branches restore it.
  extract:
    name: extract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: versions
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          rustc --version
          charon version
          aeneas -version
      - name: extract
        shell: nix develop --command bash -euo pipefail {0}
        run: scripts/extract.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extract
          path: _tmp/extract/lean
          if-no-files-found: error

  # The Lean proof package in proof/ (spec 10). The job checks the source rules of spec 10.9, builds the package, checks it with the official kernel and audits the axioms. Only propext, Classical.choice and Quot.sound are allowed.
  # leanchecker crashes on some runs when it replays two or more modules in parallel (issue #15), so scripts/leanchecker.sh runs it once with --fresh on the root module.
  proof:
    name: proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/proof-rules.sh
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: proof
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          axiom-audit: true
          axiom-audit-root: RuleanProof
      - run: scripts/leanchecker.sh

  # The export of the proof package, checked by three kernels: rulean, nanoda and con-leche (spec 10.9 and rule 5 of the release gate in 11.7). nanoda is built from the commit that the Lean Kernel Arena pins, with the configuration of the Arena. con-leche is the package that proof/ requires at a pinned commit, and it runs in verified mode. The job builds two checkers from outside the project, so it is not a required check.
  proof-kernels:
    name: proof kernels
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NANODA_REV: 0da9f98feadd3a0a2ef4b3dbcf52a298a6fef929
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo build --locked --release --bin rulean
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: proof
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - name: the bin directory of the Lean toolchain of proof/ on PATH, for leanexport
        working-directory: proof
        run: dirname "$(elan which lean)" >> "$GITHUB_PATH"
      - name: con-leche at the commit that proof/ requires
        working-directory: proof/.lake/packages/con-leche
        run: lake build con-leche
      - name: nanoda at the commit of the Arena
        env:
          RUSTFLAGS: ""
        run: |
          git init -q "$RUNNER_TEMP/nanoda"
          git -C "$RUNNER_TEMP/nanoda" fetch -q --depth 1 https://github.com/ammkrn/nanoda_lib "$NANODA_REV"
          git -C "$RUNNER_TEMP/nanoda" checkout -q FETCH_HEAD
          cd "$RUNNER_TEMP/nanoda"
          cargo build --release
      - name: rulean, nanoda and con-leche on the export of RuleanProof
        run: scripts/proof-kernels.sh _tmp/proof-kernels target/release/rulean "$RUNNER_TEMP/nanoda/target/release/nanoda_bin" proof/.lake/packages/con-leche/.lake/build/bin/con-leche

  # The Verus proof of contract K1 for rulean-pool (spec 10.7), in proof/verus/pool.rs. The job uses a pinned Verus release. This release needs Rust 1.100.0, which is the toolchain of rust-toolchain.toml.
  verus:
    name: verus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERUS_RELEASE: 0.2026.11.22.1ce6a59
      # The digest of verus-0.2026.11.22.1ce6a59-x86-linux.zip on the release page of verus-lang/verus.
      VERUS_SHA256: c955d5958877f4f907cce80aa996d4239a481984829d82e325938c7bf242b0db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: install Verus
        run: |
          curl -sSfL --retry 3 -o _verus.zip "https://github.com/verus-lang/verus/releases/download/release/${VERUS_RELEASE}/verus-${VERUS_RELEASE}-x86-linux.zip"
          echo "${VERUS_SHA256}  _verus.zip" | sha256sum -c -
          mkdir -p _tmp
          unzip -q _verus.zip -d _tmp
          _tmp/verus-x86-linux/verus --version
      - run: _tmp/verus-x86-linux/verus proof/verus/pool.rs

  # cargo-deny checks the advisories, the licences, the sources and the banned crates of deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features

  # zizmor finds unsafe patterns in the workflows, for example template injection and credentials that persist in the checkout.
  workflows:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
