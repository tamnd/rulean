name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# No job in this workflow writes to the repository. A job that needs more access must ask for it by name.
permissions:
  contents: read

# A new push cancels the older run on the same branch. On main, each commit gets its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      # The release profile has its own settings (fat LTO, abort on panic, overflow checks). Build it on each platform so that a fault in it shows before a release.
      - run: cargo build --workspace --locked --release

  # The build with 64-bit expression handles (spec 04.2.1). It is a separate type, so clippy and the tests run on it too.
  wide:
    name: wide
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked --features rulean-store/wide -- -D warnings
      - run: cargo test --workspace --locked --features rulean-store/wide

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --locked

  # The commands that exist must work. The commands that are not written yet must exit with code 2 (decline) and never with 0.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo build --locked --bin rulean --bin rulean-bench
      # The bench harness runs `true` and `false` as the checker on one good test and one bad test. GitHub-hosted runners have no hardware counters, so the counter is none.
      - name: bench harness
        run: |
          mkdir -p _tmp/bench/good _tmp/bench/bad
          touch _tmp/bench/good/a.ndjson _tmp/bench/bad/b.ndjson
          target/debug/rulean-bench run --counter none --out _tmp/bench/true.json _tmp/bench -- true {}
          target/debug/rulean-bench run --counter none --out _tmp/bench/false.json _tmp/bench -- false {}
          jq -e '[.results[].correctness] == ["correct", "incorrect"]' _tmp/bench/true.json
          jq -e '[.results[].correctness] == ["incorrect", "correct"]' _tmp/bench/false.json
          jq -e '.results[0].max_rss > 0' _tmp/bench/true.json
      - name: help and version
        run: |
          target/debug/rulean help
          target/debug/rulean version | grep -E '^rulean [0-9]+\.[0-9]+\.[0-9]+'
      - name: an unknown command exits with code 64
        run: |
          code=0
          target/debug/rulean frobnicate || code=$?
          test "$code" = 64
      - name: check accepts and rejects
        run: |
          mkdir -p _tmp
          target/debug/rulean check --report _tmp/accept.json crates/rulean-cli/tests/data/axiom.ndjson
          jq -e '.verdict == "accept" and .summary.accepted == 1 and .input.profile == "v4.35"' _tmp/accept.json
          code=0
          target/debug/rulean check --format json - < crates/rulean-cli/tests/data/loose-bvar.ndjson > _tmp/reject.json || code=$?
          test "$code" = 1
          jq -e '.verdict == "reject" and .failed_decl == "B"' _tmp/reject.json
          code=0
          target/debug/rulean check --threads 2 --format json crates/rulean-cli/tests/data/loose-bvar.ndjson > _tmp/reject2.json || code=$?
          test "$code" = 1
          jq -e '.verdict == "reject" and .failed_decl == "B"' _tmp/reject2.json

  # Every test of the Lean Kernel Arena must parse (milestone M1) and give the expected verdict (milestone M2). The job downloads the Arena, so it depends on arena.lean-lang.org and is not a required check.
  arena:
    name: arena
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo build --locked --release --bin rulean
      - run: scripts/arena-fetch.sh _tmp/arena
      - run: scripts/arena-parse.sh _tmp/arena/tests
      - name: the parser tests on the Arena
        run: RULEAN_ARENA="$PWD/_tmp/arena/tests" cargo test --locked --release -p rulean-format --test arena
      - name: the Init prelude on engine R
        run: cargo test --locked --release -p rulean-core --test arena
      # The reference digests of primitive pinning (spec 05.8) must be the digests of the Lean v4.36.0 exports of the Arena.
      - name: the pinning digests
        run: |
          a=_tmp/arena/tests/good
          python3 scripts/pin-digests.py "$a/init-prelude.ndjson" "$a/perf/gf3-matrix-product.ndjson" "$a/perf/short-circuit-and.ndjson" "$a/perf/grind-ring-5.ndjson" | diff - crates/rulean-core/src/pin_ref_v4_35.in
      - name: the verdicts of the Arena entry
        run: scripts/arena-check.sh _tmp/arena/tests
      - name: engine F and engine R on the Arena
        run: scripts/arena-confirm.sh _tmp/arena/tests
      - name: the scheduler on the Arena
        run: scripts/arena-threads.sh _tmp/arena/tests 4

  # The Arena tarball does not have the 30 tests with the outcome either, so the job builds them from the Arena sources at the commit of results.json with the Lean v4.36.0 release. The verdicts must be the verdicts of the official kernel in docs/arena/either-v4.35.tsv. The job depends on arena.lean-lang.org and on the Lean release, so it is not a required check.
  arena-either:
    name: arena either
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_ASSET: lean-4.36.0-linux.tar.zst
      LEAN_SHA256: 2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo build --locked --release --bin rulean
      - run: scripts/arena-fetch.sh _tmp/arena
      - name: the Lean v4.36.0 release
        run: |
          mkdir -p _tmp/lean
          curl -sSfL --retry 3 -o "_tmp/lean/$LEAN_ASSET" "https://github.com/leanprover/lean4/releases/download/v4.36.0/$LEAN_ASSET"
          echo "$LEAN_SHA256  _tmp/lean/$LEAN_ASSET" | sha256sum -c -
          tar --zstd -xf "_tmp/lean/$LEAN_ASSET" -C _tmp/lean
          echo "$PWD/_tmp/lean/lean-4.36.0-linux/bin" >> "$GITHUB_PATH"
      - name: the Arena sources at the commit of the results
        run: |
          rev="$(jq -r .meta.git_revision _tmp/arena/results.json)"
          git init -q _tmp/src/arena
          git -C _tmp/src/arena fetch -q --depth 1 https://github.com/leanprover/lean-kernel-arena "$rev"
          git -C _tmp/src/arena checkout -q FETCH_HEAD
      - name: the exports of the either tests
        run: |
          lean --version
          scripts/arena-build.py _tmp/src/arena _tmp/arena/results.json _tmp/arena-extra
      - name: the verdicts of the either tests
        run: scripts/arena-check.sh _tmp/arena-extra
      - name: engine F and engine R on the either tests
        run: scripts/arena-confirm.sh _tmp/arena-extra

  # rulean as an external kernel of lake comparator, with the bwrap sandbox of lake (spec 09.5), the cross-validation of the `.olean` reader with lean4export on Init of the release (spec 07.3.6), and the work gate of the quick suite on Init and Std (spec 08.7.4). Ubuntu 24.04 blocks the user namespaces that bwrap needs, so the job allows them first. The job depends on the Lean release, so it is not a required check.
  lake:
    name: lake comparator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LEAN_ASSET: lean-4.36.0-linux.tar.zst
      LEAN_SHA256: 2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo build --locked --release --bin rulean --bin rulean-bench
      - run: cargo build --locked --release -p rulean-olean --example olean_compare
      - name: bwrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: the Lean v4.36.0 release
        run: |
          mkdir -p _tmp/lean
          curl -sSfL --retry 3 -o "_tmp/lean/$LEAN_ASSET" "https://github.com/leanprover/lean4/releases/download/v4.36.0/$LEAN_ASSET"
          echo "$LEAN_SHA256  _tmp/lean/$LEAN_ASSET" | sha256sum -c -
          tar --zstd -xf "_tmp/lean/$LEAN_ASSET" -C _tmp/lean
          echo "$PWD/_tmp/lean/lean-4.36.0-linux/bin" >> "$GITHUB_PATH"
      - name: rulean in lake comparator
        run: scripts/lake-comparator.sh
      - name: the .olean reader and lean4export on Init of the release
        run: scripts/olean-xval.sh _tmp/lean/lean-4.36.0-linux/lib/lean
      - name: the work gate on Init and Std of the release
        run: scripts/work-gate.sh docs/bench/work.json

  # The repository rules of the spec: the dependency rule (03.3), the no-C policy (13.3) and the Aeneas subset (10.6). `cargo xtask all` also scans the vendored source of each dependency.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask all

  # Charon and Aeneas translate the verified core to Lean (spec 10.3). The tools come from flake.nix. hacl.cachix.org is the binary cache of Aeneas, but it does not have all of the paths of our Aeneas commit. So the job also keeps the full Nix store in one Actions cache entry, keyed by flake.lock. Only runs on main save the entry, and other branches restore it.
  extract:
    name: extract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: versions
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          rustc --version
          charon version
          aeneas -version
      - name: extract
        shell: nix develop --command bash -euo pipefail {0}
        run: scripts/extract.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extract
          path: _tmp/extract/lean
          if-no-files-found: error

  # The Lean proof package in proof/ (spec 10). The job checks the source rules of spec 10.9, builds the package, checks it with the official kernel and audits the axioms. Only propext, Classical.choice and Quot.sound are allowed.
  # leanchecker crashes on some runs when it replays two or more modules in parallel (issue #15), so scripts/leanchecker.sh runs it once with --fresh on the root module.
  proof:
    name: proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/proof-rules.sh
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: proof
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          axiom-audit: true
          axiom-audit-root: RuleanProof
      - run: scripts/leanchecker.sh

  # The Verus proof of contract K1 for rulean-pool (spec 10.7), in proof/verus/pool.rs. The job uses a pinned Verus release. This release needs Rust 1.100.0, which is the toolchain of rust-toolchain.toml.
  verus:
    name: verus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERUS_RELEASE: 0.2026.11.22.1ce6a59
      # The digest of verus-0.2026.11.22.1ce6a59-x86-linux.zip on the release page of verus-lang/verus.
      VERUS_SHA256: c955d5958877f4f907cce80aa996d4239a481984829d82e325938c7bf242b0db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: install Verus
        run: |
          curl -sSfL --retry 3 -o _verus.zip "https://github.com/verus-lang/verus/releases/download/release/${VERUS_RELEASE}/verus-${VERUS_RELEASE}-x86-linux.zip"
          echo "${VERUS_SHA256}  _verus.zip" | sha256sum -c -
          mkdir -p _tmp
          unzip -q _verus.zip -d _tmp
          _tmp/verus-x86-linux/verus --version
      - run: _tmp/verus-x86-linux/verus proof/verus/pool.rs

  # cargo-deny checks the advisories, the licences, the sources and the banned crates of deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features

  # zizmor finds unsafe patterns in the workflows, for example template injection and credentials that persist in the checkout.
  workflows:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
