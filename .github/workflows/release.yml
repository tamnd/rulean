name: release

on:
  push:
    tags: ["v*"]
  # A person can build the binaries of a tag again, for example when the release of the tag has no binaries.
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag to build, for example v0.1.1"
        required: true
        type: string
  # A pull request that changes the build gets the two builds and the comparison of the hashes, but no packages and no release.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The build must not depend on the time or the machine. Spec 12.6 requires that two independent builders get the same binary hash before a release is published.
  SOURCE_DATE_EPOCH: 0

jobs:
  build:
    name: build (${{ matrix.target }}, builder ${{ matrix.builder }})
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-pc-windows-msvc]
        # Builder 1 tests the code and makes the package. Builder 2 is a second runner that builds from a checkout at a different path. The job verify compares the two binaries.
        builder: [1, 2]
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
          - { builder: 1, src: rulean }
          - { builder: 2, src: other/src/rulean }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          path: ${{ matrix.src }}
      # No build cache in a release. A cache that a pull request wrote must not go into a release binary.
      - run: rustup show active-toolchain || rustup toolchain install
      # The two builders use the same target directory, so the paths of the object files are the same. The checkout path and the Cargo home are different on each machine, so the compiler replaces them with fixed names. On Windows, /Brepro removes the time stamp and /PDBALTPATH keeps only the file name of the PDB.
      - name: build flags
        env:
          TARGET: ${{ matrix.target }}
          TARGET_DIR: ${{ runner.temp }}/target
        run: |
          src="$(pwd -P)"
          home="${CARGO_HOME:-$HOME/.cargo}"
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then
            src="$(cygpath -w "$src")"
            home="$(cygpath -w "$home")"
          fi
          flags="--remap-path-prefix=${src}=/rulean --remap-path-prefix=${home}=/cargo"
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then
            flags="$flags -Clink-arg=/Brepro -Clink-arg=/PDBALTPATH:%_PDB%"
          fi
          {
            echo "RUSTFLAGS=$flags"
            echo "CARGO_TARGET_DIR=$TARGET_DIR"
          } >> "$GITHUB_ENV"
      - if: matrix.builder == 1
        run: cargo test --workspace --locked
      - run: cargo build --locked --release --bin rulean
      - name: hash
        env:
          TARGET: ${{ matrix.target }}
          BUILDER: ${{ matrix.builder }}
        run: |
          ext=""
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then ext=".exe"; fi
          mkdir -p "$RUNNER_TEMP/hash"
          cp "$CARGO_TARGET_DIR/release/rulean${ext}" "$RUNNER_TEMP/hash/rulean-${TARGET}-${BUILDER}${ext}"
          cd "$RUNNER_TEMP/hash"
          # macOS has shasum and not sha256sum.
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          $sum "rulean-${TARGET}-${BUILDER}${ext}" | tee "rulean-${TARGET}-${BUILDER}.sha256"
      # The job verify reads the hash. The binary is kept for 3 days, so that a person can compare the two binaries when the hashes are different.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hash-${{ matrix.target }}-${{ matrix.builder }}
          path: ${{ runner.temp }}/hash/*
          if-no-files-found: error
          retention-days: 3
      - name: package
        if: matrix.builder == 1 && github.event_name != 'pull_request'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          name="rulean-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          ext=""
          if [ "$ARCHIVE" = zip ]; then ext=".exe"; fi
          cp "$CARGO_TARGET_DIR/release/rulean${ext}" "dist/$name/"
          cp README.md CHANGELOG.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          "dist/$name/rulean${ext}" version | grep -F "rulean ${TAG#v}"
          cd dist
          if [ "$ARCHIVE" = zip ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - if: matrix.builder == 1 && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rulean-${{ matrix.target }}
          path: ${{ matrix.src }}/dist/*
          if-no-files-found: error
          retention-days: 7

  verify:
    name: verify (same binary hash)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: hash
          pattern: hash-*
          merge-multiple: true
      - name: compare
        working-directory: hash
        run: |
          status=0
          for one in rulean-*-1.sha256; do
            target="${one#rulean-}"
            target="${target%-1.sha256}"
            a="$(cut -d' ' -f1 "$one")"
            b="$(cut -d' ' -f1 "rulean-${target}-2.sha256")"
            if [ "$a" = "$b" ]; then
              echo "$target: the two builders have the same hash $a"
            else
              echo "::error::$target: builder 1 has $a and builder 2 has $b"
              status=1
            fi
          done
          exit "$status"

  publish:
    name: publish
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # The attestation step needs these two permissions. It signs a statement that says which commit and which run made each archive.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: rulean-*
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum ./* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/rulean-*
      - name: notes from the changelog
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # The notes are the section of CHANGELOG.md for the tag. The section starts at "## [x.y.z]" and stops at the next "## [" or at the link references at the end of the file.
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # A release that a person made before the run keeps its notes and gets the binaries.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md
          fi
