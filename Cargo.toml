[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.7"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tamnd/rulean"
authors = ["The rulean authors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
# scripts/extract.sh sets this cfg for the Aeneas names of spec 10.3.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rulean_extract)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

# The release profile is the profile of 13.3.3 in the spec. Overflow checks stay on, because the proofs describe checked arithmetic.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = "line-tables-only"

[profile.dev]
panic = "abort"
overflow-checks = true
