[package]
name = "rulean-cli"
description = "The rulean command line: check Lean 4 exports with the rulean kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.rulean]
# The layer of spec section 03.2. xtask checks the dependency rule of 03.3 from this value.
layer = "hardened"

[[bin]]
name = "rulean"
path = "src/main.rs"

[dependencies]
rulean-core = { path = "../rulean-core" }
rulean-format = { path = "../rulean-format" }
rulean-io = { path = "../rulean-io" }
rulean-pack = { path = "../rulean-pack" }
rulean-pool = { path = "../rulean-pool" }
rulean-store = { path = "../rulean-store" }

[lints]
workspace = true
