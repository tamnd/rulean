[package]
name = "rulean-olean"
description = "A hardened reader for Lean .olean files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.rulean]
# The layer of spec section 03.2. xtask checks the dependency rule of 03.3 from this value.
layer = "hardened"

[lints]
workspace = true

[dependencies]
rulean-core = { path = "../rulean-core" }
rulean-format = { path = "../rulean-format" }
rulean-nat = { path = "../rulean-nat" }
rulean-store = { path = "../rulean-store" }
