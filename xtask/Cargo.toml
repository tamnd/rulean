[package]
name = "xtask"
description = "Repository checks for rulean: the dependency rule, the no-C policy and the Aeneas subset."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.rulean]
layer = "tool"

[dependencies]
serde_json = "1"
syn = { version = "3", default-features = false, features = ["full", "visit", "parsing", "printing"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }

[lints]
workspace = true
